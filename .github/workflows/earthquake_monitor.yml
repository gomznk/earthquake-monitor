name: Earthquake Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run earthquake monitor
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASSIGNEE_EMAIL: ${{ secrets.ASSIGNEE_EMAIL }}
          PROJECT_GID: ${{ secrets.PROJECT_GID }}
          SECTION_GID: ${{ secrets.SECTION_GID }}
        run: python earthquake_monitor.py

      # 連続失敗の記録(failure_state.json)も残す必要があるため、
      # 監視ステップが失敗した場合でもこのステップは実行する
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Update earthquake monitor state"
          git push || (git pull --rebase && git push)
